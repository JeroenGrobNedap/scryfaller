<header class="topbar">
  <h1>Scryfaller</h1>
  <span class="tagline">Type what you want, get a Scryfall query</span>
  <span class="spacer"></span>
  <button type="button" class="ghost" (click)="store.reset()">New</button>
</header>

<app-phrase-search />

<section class="card filters-card" aria-label="Filters">
  <app-filters-panel [filters]="store.state().filters" />
</section>

<section class="card output" aria-live="polite">
  <div class="query-row">
    <code class="query">{{ store.query() || 'Your query appears here' }}</code>
    <div class="query-actions">
      <button type="button" (click)="copy()" [disabled]="!store.query()">{{ copied() ? 'Copied' : 'Copy' }}</button>
      <a class="button primary" [href]="scryfallUrl(store.query())" target="_blank" rel="noopener">Scryfall ↗</a>
    </div>
  </div>
  <app-part-counts />
  <details class="advanced">
    <summary>Edit card text by hand</summary>
    <app-node-editor [node]="store.state().root" />
  </details>
</section>

<app-saved-panel />

<app-shortlist />

<app-results />

<app-update-notice />
